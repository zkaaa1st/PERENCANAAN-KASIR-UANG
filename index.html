<html lang="id"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PERENCAAN KEUANGAN </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Aplikasi Perencanaan Keuangan</h1>
    <p class="lead">PEMASUKAN DAN PENGELUARAN INCOME DAN OUTCOME </p>
  </header>

  <main class="container">
    <section class="summary" aria-live="polite">
      <div class="card">
        <center><h2>PERENCANAAN KEUANGAN</h2></center>
        <div class="totals">
          <div class="total-block">
            <div class="label">Income</div>
            <div id="total-income" class="value">Rp&nbsp;0</div>
          </div>
          <div class="total-block">
            <div class="label">Outcome</div>
            <div id="total-outcome" class="value">Rp&nbsp;0</div>
          </div>
          <div class="total-block balance">
            <div class="label">Uang</div>
            <div id="balance" class="value" style="color: var(--success);">Rp&nbsp;0</div>
          </div>
        </div>
      </div>
    </section>

    <section class="forms">
      <div class="card">
        <h2>Pemasukan (Income)</h2>
        <form id="income-form" class="form">
          <label>
            Kategori Pemasukan
            <select name="category" required="">
               <option value=""></option>
              <option value="Pendapatan dari Pekerjaan Utama"> Pendapatan dari Pekerjaan Utama</option>
              <option value="Pendapatan dari Usaha Sendiri/Wirausaha">Pendapatan dari Usaha Sendiri/Wirausaha</option>
              <option value="Pendapatan Pasif dan Investasi">Pendapatan Pasif dan Investasi</option>
              <option value="Dana Pensiun dan Jaminan Sosial">Dana Pensiun dan Jaminan Sosial</option>
            </select>
          </label>

          <label>
            Jumlah nominal (angka)
            <input name="amount" type="number" min="0" step="1" required="">
          </label>

          <label>
            Keterangan
            <input name="description" type="text" placeholder="">
          </label>

          <div class="form-actions">
            <button type="submit" class="btn primary">Tambah Income</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Pengeluaran (Outcome)</h2>
        <form id="outcome-form" class="form">
          <label>
            Kategori Pengeluaran
            <select name="category" required=""> 
              <option value=""></option>
              <option value="Makanan & Kebutuhan Sehari-hari">Makanan & Kebutuhan Sehari-hari</option>
              <option value="Transportasi">Transportasi </option>
              <option value="Uang Jajan Anak">Uang Jajan Anak</option>
              <option value="Pendidikan & Perawatan Anak">Pendidikan & Perawatan Anak</option>
              <option value="Tabungan & Invenstasi">Tabungan & Investasi </option>
            </select>
          </label>

          <label>
            Jumlah nominal (angka)
            <input name="amount" type="number" min="0" step="1" required="">
          </label>

          <label>
            Keterangan
            <input name="description" type="text" placeholder="">
          </label>

          <div class="form-actions">
            <button type="submit" class="btn danger">Tambah Outcome</button>
          </div>
        </form>
      </div>
    </section>

    <section class="lists">
      <div class="card">
        <h2>Income</h2>
        <ul id="income-list" class="list" aria-live="polite"><li class="empty">Belum ada pemasukan</li></ul>
      </div>

      <div class="card">
        <h2>Daftar Outcome</h2>
        <ul id="outcome-list" class="list" aria-live="polite"><li class="empty">Belum ada pengeluaran</li></ul>
      </div>
    </section>

    <section class="controls">
      <button id="seed-data" class="btn">Isi Data Contoh</button>
      <button id="clear-data" class="btn">Hapus Semua Data</button>
      <button id="export-excel" class="btn primary">Ekspor Excel</button>
      <label for="import-excel" class="btn">
        Impor Excel
        <input type="file" id="import-excel" accept=".xlsx, .xls" hidden="">
      </label>
    </section>


    
  </main>

  <script src="xlsx.full.min.js"></script>
  <script type="module" src="app.js"></script>




  <script>
    document.onkeydown = function(e) {
    if(event.keyCode == 123) {
    return false;
    }
    if(e.ctrlKey && e.keyCode == 'E'.charCodeAt(0)){
    return false;
    }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)){
    return false;
    }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)){
    return false;
    }
    if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)){
    return false;
    }
    if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)){
    return false;
    }
    if(e.ctrlKey && e.keyCode == 'H'.charCodeAt(0)){
    return false;
    }
    if(e.ctrlKey && e.keyCode == 'A'.charCodeAt(0)){
    return false;
    }
    if(e.ctrlKey && e.keyCode == 'F'.charCodeAt(0)){
    return false;
    }
    if(e.ctrlKey && e.keyCode == 'E'.charCodeAt(0)){
    return false;
    }
    }
    </script>
    <script type="text/javascript">
        //Script tidak bisa diklik kanan
        var message="TIDAK BISA DIKLIK KANAN";
        function clickdsb(){
        if (event.button==2){
        alert(message);
        return false;
        }
        }
        function clickbsb(e){
        if (document.layers||document.getElementById&&!document.all){
        if (e.which==2||e.which==3){
        alert(message);
        return false;
        }
        }
        }
        if (document.layers){
        document.captureEvents(Event.MOUSEDOWN);
        document.onmousedown=clickbsb;
        }
        else if (document.all&&!document.getElementById){
        document.onmousedown=clickdsb;
        }
        
        document.oncontextmenu=new Function("alert(message);return false")
</script>


</body></html>
